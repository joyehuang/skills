<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>夹夹 · 方案对比</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="page-frame site-header-inner">
        <a class="brand" href="#"><span class="filo-avatar"></span><span><div class="brand-name font-heading">夹夹</div></span></a>
      </div>
    </header>
    <main class="page-frame" style="padding-bottom: 3rem">
      <header class="page-intro" style="text-align: center; max-width: 32rem; margin: 0 auto">
        <p class="eyebrow font-heading" style="justify-content: center">能力</p>
        <h1 class="font-heading">选择适合团队的方案</h1>
        <p style="color: var(--muted-foreground); margin: 0.5rem 0 0">对比卡仅边框分层，推荐档用 sky-soft  tint，不用渐变按钮。</p>
      </header>
      <div class="pricing-grid" style="margin-top: 2rem">
        <article class="card price-card">
          <h2 class="font-heading" style="font-size: 1.1rem; margin: 0">个人</h2>
          <p class="price-amount">¥0</p>
          <ul style="margin: 0 0 1.25rem; padding-left: 1.1rem; color: var(--muted-foreground); font-size: 14px; line-height: 1.7">
            <li>公开问答</li>
            <li>基础专题</li>
          </ul>
          <a class="btn btn-outline" href="#" style="width: 100%">开始使用</a>
        </article>
        <article class="card price-card featured">
          <p style="margin: 0 0 0.35rem; font-size: 12px; color: var(--coral-ink); font-weight: 600">★ 推荐</p>
          <h2 class="font-heading" style="font-size: 1.1rem; margin: 0">团队</h2>
          <p class="price-amount">¥199<span style="font-size: 14px; color: var(--muted-foreground)">/月</span></p>
          <ul style="margin: 0 0 1.25rem; padding-left: 1.1rem; color: var(--muted-foreground); font-size: 14px; line-height: 1.7">
            <li>私有知识库</li>
            <li>协作编辑</li>
            <li>优先同步</li>
          </ul>
          <a class="btn btn-primary" href="#" style="width: 100%">试用 14 天</a>
        </article>
        <article class="card price-card">
          <h2 class="font-heading" style="font-size: 1.1rem; margin: 0">企业</h2>
          <p class="price-amount">定制</p>
          <ul style="margin: 0 0 1.25rem; padding-left: 1.1rem; color: var(--muted-foreground); font-size: 14px; line-height: 1.7">
            <li>SSO</li>
            <li>专属部署</li>
          </ul>
          <a class="btn btn-outline" href="#" style="width: 100%">联系销售</a>
        </article>
      </div>
    </main>
  </body>
</html>
