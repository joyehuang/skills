<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>夹夹 · 移动端导航</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      .demo-note {
        margin: 1.25rem 0;
        padding: 0.85rem 1rem;
        background: var(--sky-soft);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .content-block {
        padding: 1.25rem;
        border-radius: 1rem;
        margin-bottom: 1rem;
      }
      /* Force mobile header behavior for this demo at all widths when narrow viewport */
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="page-frame site-header-inner">
        <a class="brand" href="#">
          <span class="filo-avatar"></span>
          <span>
            <div class="brand-name font-heading">夹夹</div>
            <div class="brand-tagline">知识助手</div>
          </span>
        </a>
        <nav class="nav-desktop" aria-label="桌面导航">
          <a href="#">首页</a>
          <a class="is-active" href="#">问答</a>
          <a href="#">专题</a>
          <a href="#">更多</a>
        </nav>
        <button
          type="button"
          class="nav-mobile-toggle hit-area"
          id="menu-open"
          aria-label="打开导航菜单"
          aria-expanded="true"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </header>

    <div class="drawer-backdrop is-open" id="backdrop" aria-hidden="true"></div>
    <nav class="nav-drawer is-open" id="drawer" aria-label="移动端导航">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem">
        <span class="font-heading" style="font-size: 1.1rem">菜单</span>
        <button type="button" class="nav-mobile-toggle hit-area" id="menu-close" aria-label="关闭菜单" style="display: inline-flex">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <a href="#">首页</a>
      <a href="#" style="background: var(--accent)">问答</a>
      <a href="#">专题</a>
      <a href="#">设置</a>
      <a href="#">关于夹夹</a>
    </nav>

    <main class="page-frame">
      <p class="demo-note">
        ≤767px 时桌面导航隐藏，44px 触控目标打开 NavDrawer。本页默认展开抽屉，便于 390px 截图验收。
      </p>
      <article class="card content-block">
        <h1 class="font-heading" style="font-size: 25px; margin: 0 0 0.5rem">移动端 page-intro</h1>
        <p style="margin: 0; color: var(--muted-foreground)">栅格单列、内边距约 19px，品牌字 text-sm。</p>
      </article>
    </main>

    <script>
      const drawer = document.getElementById("drawer");
      const backdrop = document.getElementById("backdrop");
      const openBtn = document.getElementById("menu-open");
      const closeBtn = document.getElementById("menu-close");
      function setOpen(open) {
        drawer.classList.toggle("is-open", open);
        backdrop.classList.toggle("is-open", open);
        openBtn.setAttribute("aria-expanded", String(open));
      }
      openBtn.addEventListener("click", () => setOpen(true));
      closeBtn.addEventListener("click", () => setOpen(false));
      backdrop.addEventListener("click", () => setOpen(false));
    </script>
  </body>
</html>
