<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>夹夹 · 数据表格</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="page-frame site-header-inner">
        <a class="brand" href="#"><span class="filo-avatar"></span><span><div class="brand-name font-heading">夹夹后台</div></span></a>
      </div>
    </header>
    <main class="page-frame" style="padding-bottom: 3rem">
      <header class="page-intro">
        <p class="eyebrow font-heading">后台</p>
        <h1 class="font-heading">知识库条目</h1>
      </header>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>标题</th>
              <th>类型</th>
              <th class="font-mono">截至</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>FAQ 写作规范</td>
              <td><span class="type-chip chip-method">method</span></td>
              <td class="font-mono">2026-03-18</td>
              <td>已发布</td>
            </tr>
            <tr>
              <td>TypeChip 配色</td>
              <td><span class="type-chip chip-concept">concept</span></td>
              <td class="font-mono">2026-03-12</td>
              <td>已发布</td>
            </tr>
            <tr>
              <td>推荐星标规则</td>
              <td><span class="type-chip chip-pick">pick</span></td>
              <td class="font-mono">2026-03-05</td>
              <td>草稿</td>
            </tr>
            <tr>
              <td>阅读页 mark</td>
              <td><span class="type-chip chip-read">read</span></td>
              <td class="font-mono">2026-02-28</td>
              <td>已发布</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p style="margin-top: 1rem; font-size: 13px; color: var(--muted-foreground)">表格 hover 使用 accent 浅底；日期列用 IBM Plex Mono。</p>
    </main>
  </body>
</html>
