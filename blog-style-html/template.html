<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标题</title>
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
/* blog-style-html · tokens first. Light + dark. One accent. Borders, not shadows.
   Type scale: 13 · 15 · 17 · 22 · clamp(30–40). Weights 400 · 500 · 700. */
:root{
  --paper:#fbfbfa; --card:#ffffff; --sunk:#f3f4f4;
  --ink:#0f1112; --ink-2:#3a3f44; --ink-3:#6b7177;
  --line:rgba(15,17,18,.12); --line-2:rgba(15,17,18,.06);
  --accent:#4f7a8c; --accent-soft:#e3edf1; --mark:#ffe08a;
  --font:Satoshi,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --col:44rem; --r:12px; --r-sm:8px; --ease:cubic-bezier(.2,.7,.3,1);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0c0d10; --card:#14161a; --sunk:#101216;
  --ink:#f4f5f6; --ink-2:#c3c8cd; --ink-3:#8b9198;
  --line:rgba(244,245,246,.13); --line-2:rgba(244,245,246,.06);
  --accent:#9cc9da; --accent-soft:#1b2a31; --mark:#7a611a;
}}
:root[data-theme=dark]{
  --paper:#0c0d10; --card:#14161a; --sunk:#101216;
  --ink:#f4f5f6; --ink-2:#c3c8cd; --ink-3:#8b9198;
  --line:rgba(244,245,246,.13); --line-2:rgba(244,245,246,.06);
  --accent:#9cc9da; --accent-soft:#1b2a31; --mark:#7a611a;
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink-2);font:400 17px/1.8 var(--font);-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;scroll-padding-top:24px}
body{margin:0;padding:0 1.5rem 6rem;overflow-x:clip}
/* one centered column for everything: header, article, footer */
.top,article,footer{max-width:var(--col);margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:1.6rem 0 0}
.top .name{font-weight:700;color:var(--ink);letter-spacing:-.01em;text-decoration:none}
.top-actions{display:flex;align-items:center;gap:.5rem}
.notes-btn{display:inline-flex;align-items:center;height:2.1rem;padding:0 .85rem;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:.8rem;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.notes-btn:hover{background:var(--accent);color:var(--bg)}
@media (max-width:480px){.notes-btn{height:1.9rem;padding:0 .6rem;font-size:.72rem}}
.theme-btn{display:grid;place-items:center;width:2.1rem;height:2.1rem;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s}
.theme-btn:hover{background:var(--sunk);color:var(--ink)}
.theme-btn svg{width:1rem;height:1rem}
.theme-btn .sun{display:none}
:root[data-theme=dark] .theme-btn .sun{display:block}:root[data-theme=dark] .theme-btn .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .theme-btn .sun{display:block}:root:not([data-theme=light]) .theme-btn .moon{display:none}}
/* hero */
.hero{text-align:center;padding:4.5rem 0 2.75rem;border-bottom:1px solid var(--line);margin-bottom:2.5rem}
.source{display:inline-flex;gap:.5em;align-items:center;font:500 13px/1.4 var(--mono);color:var(--ink-2);border:1px solid var(--line,rgba(127,127,127,.3));border-radius:999px;padding:.35em .9em;margin:0 0 1.4rem;text-decoration:none}.source b{color:var(--accent);font-weight:600}.source:hover{border-color:var(--accent)}
.kicker{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 1.1rem}
h1{font-size:clamp(30px,5.2vw,42px);line-height:1.18;font-weight:700;letter-spacing:-.025em;color:var(--ink);margin:0 auto .9rem;max-width:18em;text-wrap:balance}
.dek{font-size:19px;line-height:1.65;color:var(--ink-2);max-width:32em;margin:0 auto 1.4rem;text-wrap:pretty}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:.35rem 1.1rem;font-size:13px;color:var(--ink-3)}
.meta span+span:before{content:"·";margin-right:1.1rem;opacity:.6}
/* body type */
h2{position:relative;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin:3.2rem 0 .9rem;text-wrap:balance}
h2 .n{position:absolute;right:calc(100% + 1.1rem);top:.35em;font:500 13px/1 var(--mono);color:var(--ink-3)}
h3{font-size:17px;font-weight:700;color:var(--ink);margin:2rem 0 .5rem}
p{margin:0 0 1.15rem;text-wrap:pretty}
a{color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;transition:text-decoration-color .2s}
a:hover{text-decoration-color:var(--accent)}
strong{color:var(--ink);font-weight:700}
ol,ul{padding-left:1.4rem;margin:0 0 1.2rem} li{margin:.4rem 0} li::marker{color:var(--ink-3)}
code{font:500 .86em var(--mono);color:var(--ink);background:var(--sunk);border:1px solid var(--line-2);border-radius:5px;padding:.08em .35em}
pre{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem;overflow-x:auto;font-size:14px;line-height:1.65}
pre code{background:none;border:0;padding:0;font-weight:400}
.mark{color:var(--ink);background:linear-gradient(var(--mark),var(--mark)) 0 88%/0 .45em no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .1em;transition:background-size .8s var(--ease)}
.mark.on{background-size:100% .45em}
/* callout (TL;DR) */
.callout{background:var(--accent-soft);border-radius:var(--r);padding:1.15rem 1.4rem;margin:0 0 2.25rem;color:var(--ink)}
.callout .lbl{display:block;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem}
.callout p{margin:0}
/* quotes: big pull quote + compact reply cards */
.pull{margin:2rem 0;text-align:center;font-size:clamp(22px,3.6vw,28px);line-height:1.4;font-weight:500;letter-spacing:-.015em;color:var(--ink)}
.pull:before,.pull:after{content:"";display:block;width:2.5rem;height:1px;background:var(--accent);margin:0 auto 1.1rem}
.pull:after{margin:1.1rem auto 0}
.replies{display:grid;gap:.9rem;margin:1.5rem 0 2rem}
.reply{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.25rem}
.reply blockquote{margin:0 0 .7rem;color:var(--ink);font-size:16px;line-height:1.65}
.reply figcaption{font-size:13.5px;line-height:1.6;color:var(--ink-3)}
.reply .who{font:500 13px var(--mono);color:var(--ink-2)}
.tag{display:inline-block;font:500 11.5px/1.6 var(--mono);padding:0 .5rem;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);margin-right:.4rem;vertical-align:1px}
.tag.pro{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
/* numbered steps */
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:.75rem}
.steps li{counter-increment:s;position:relative;margin:0;padding:.9rem 1.1rem .9rem 3.4rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.steps li:before{content:counter(s);position:absolute;left:1rem;top:.95rem;width:1.6rem;height:1.6rem;display:grid;place-items:center;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:600 13px/1 var(--mono)}
/* figures: a card that may break out wider than the column */
figure.fig{margin:2.5rem 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem 1.4rem 1rem;color:var(--ink)}
@media (min-width:1000px){figure.fig.wide{margin-inline:-4rem}}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig text{font-family:var(--font);font-size:14px;fill:var(--ink-2)}
.fig .t-ink{fill:var(--ink);font-weight:500}.fig .t-dim{fill:var(--ink-3);font-size:13px}.fig .t-acc{fill:var(--accent);font-weight:500}
.fig figcaption{display:flex;gap:1rem;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line-2);margin-top:1rem;padding-top:.8rem;font-size:14px;line-height:1.6;color:var(--ink-3)}
.fig figcaption b{color:var(--ink);font-weight:600;margin-right:.4rem}
.replay{flex:none;font:500 12px var(--mono);color:var(--ink-3);background:none;border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;cursor:pointer}
.replay:hover{color:var(--ink);border-color:var(--ink-3)}
/* svg primitives */
.s-axis{fill:none;stroke:var(--line);stroke-width:1.5}
.s-grid{fill:none;stroke:var(--line-2);stroke-width:1}
.s-ink{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.s-acc{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.s-dim{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:5 5;stroke-linecap:round}
.s-area{fill:var(--accent);opacity:.14}.s-area-dim{fill:var(--ink-3);opacity:.1}
.s-node{fill:var(--sunk);stroke:var(--line);stroke-width:1.2}
.s-node-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.s-dot{fill:var(--accent)}
.s-pkt{fill:var(--accent)}
/* motion: armed → play when scrolled into view */
.armed .draw{stroke-dasharray:1;stroke-dashoffset:1}
.play .draw{stroke-dashoffset:0;transition:stroke-dashoffset 1.3s cubic-bezier(.35,.1,.25,1) var(--at,0s)}
.armed .rise{opacity:0;transform:translateY(10px)}
.play .rise{opacity:1;transform:none;transition:opacity .5s ease var(--at,0s),transform .6s var(--ease) var(--at,0s)}
.armed .fade{opacity:0}.play .fade{opacity:1;transition:opacity .5s ease var(--at,0s)}
.armed .grow{transform:scaleY(0)}.play .grow{transform:none;transition:transform 1s var(--ease) var(--at,0s)}
.grow{transform-box:fill-box;transform-origin:bottom}
.play .flow{offset-rotate:0deg;animation:flow 3.2s linear var(--at,0s) infinite}
.flow{opacity:0}
@keyframes flow{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
article{animation:in .5s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
footer{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-3);text-align:center}
@media (max-width:860px){h2 .n{position:static;display:block;margin-bottom:.45rem}}
@media (max-width:640px){
  html{font-size:16px}body{padding:0 1.15rem 4rem}
  .hero{padding:3rem 0 2rem}.dek{font-size:17px}
  figure.fig{padding:1rem .9rem .8rem;margin-inline:-.25rem}
  .fig text{font-size:24px}.fig .t-dim{font-size:22px}
  .fig figcaption{flex-direction:column;gap:.5rem}
  .steps li{padding-left:3rem}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
  .mark{background-size:100% .45em}
  .armed .draw{stroke-dashoffset:0}.armed .rise,.armed .fade{opacity:1;transform:none}.armed .grow{transform:none}
  .flow{display:none}
}

</style>
</head>
<body>
<header class="top">
  <a class="name" href="https://joyehuang.me">Joye</a>
  <div class="top-actions">
  <a class="notes-btn" id="notes-btn" href="https://convert.joyehuang.dev/">转化成 notes</a>
  <button class="theme-btn" id="theme-btn" type="button" aria-label="切换浅色 / 深色">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  </div>
</header>
<article>
  <div class="hero">
    <a class="source" href="原文链接"><b>原文</b>作者 · 平台 ↗</a>
    <p class="kicker">主题 · 子主题</p>
    <h1>标题：一句话说清这篇讲什么</h1>
    <p class="dek">一两句导语：读者读完能得到什么。</p>
    <div class="meta"><span>2026 年 1 月 1 日</span><span>5 分钟读完</span><span>来源说明</span></div>
  </div>
  <div class="callout"><span class="lbl">TL;DR</span><p>三句话以内的结论，最关键的一处用<span class="mark">荧光笔</span>。</p></div>
  <h2><span class="n">01</span>第一节</h2>
  <p>正文。链接写成<a href="https://joyehuang.me">这样</a>，强调用<strong>粗体</strong>，行内代码用 <code>code</code>。</p>
  <p class="pull">一句值得放大的原话。</p>
  <figure class="fig wide" data-anim>
    <svg viewBox="0 0 720 230" role="img" aria-label="用一句话描述这张图">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" style="fill:var(--accent)"/></marker></defs>
      <g class="rise" style="--at:0s"><rect class="s-node" x="40" y="70" width="160" height="64" rx="10"/><text class="t-ink" x="120" y="108" text-anchor="middle">输入</text></g>
      <g class="rise" style="--at:.35s"><rect class="s-node" x="280" y="70" width="160" height="64" rx="10"/><text class="t-ink" x="360" y="108" text-anchor="middle">处理</text></g>
      <g class="rise" style="--at:.7s"><rect class="s-node-acc" x="520" y="70" width="160" height="64" rx="10"/><text class="t-acc" x="600" y="108" text-anchor="middle">输出</text></g>
      <path class="s-acc draw" pathLength="1" style="--at:.3s" d="M200 102H276" marker-end="url(#ah)"/>
      <path class="s-acc draw" pathLength="1" style="--at:.65s" d="M440 102H516" marker-end="url(#ah)"/>
      <text class="t-dim fade" style="--at:1.2s" x="360" y="180" text-anchor="middle">一条次要标注</text>
      <circle class="s-pkt flow" r="5" style="--at:1.2s;offset-path:path('M200 102H520')"/>
    </svg>
    <figcaption><span><b>图 1</b>一句话：读者该从图里看出什么。</span><button class="replay" type="button">重播</button></figcaption>
  </figure>
  <div class="replies">
    <figure class="reply"><blockquote>引用原文，一字不改。</blockquote><figcaption><span class="tag pro">赞同</span><span class="who">@someone</span> 的<a href="#">回复</a>：一句话点评。</figcaption></figure>
  </div>
  <ol class="steps"><li><strong>要点一。</strong>说明。</li><li><strong>要点二。</strong>说明。</li></ol>
</article>
<footer>© 2026 Joye · 来源说明</footer>
<script>
(function(){var n=document.getElementById('notes-btn');if(n)n.href='https://convert.joyehuang.dev/?url='+encodeURIComponent(location.href.split(/[?#]/)[0]);})();
(function(){var r=document.documentElement,k='theme',t=null;try{t=localStorage.getItem(k)}catch(e){}
if(t==='light'||t==='dark')r.dataset.theme=t;
var b=document.getElementById('theme-btn');if(b)b.onclick=function(){var d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
r.dataset.theme=d?'light':'dark';try{localStorage.setItem(k,r.dataset.theme)}catch(e){}};
var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
var io=function(el,fn,th){new IntersectionObserver(function(es,o){es.forEach(function(e){if(e.isIntersecting){fn();o.disconnect()}})},{threshold:th}).observe(el)};
document.querySelectorAll('.mark').forEach(function(m){still?m.classList.add('on'):io(m,function(){m.classList.add('on')},1)});
document.querySelectorAll('[data-anim]').forEach(function(f){if(still)return;f.classList.add('armed');
var play=function(){f.classList.remove('play');void f.getBoundingClientRect();f.classList.add('play')};
io(f,play,.35);var rb=f.querySelector('.replay');if(rb)rb.onclick=function(){f.classList.remove('play');requestAnimationFrame(function(){requestAnimationFrame(play)})};});
document.querySelectorAll('.replay').forEach(function(b){if(still)b.hidden=true});})();

</script>
</body>
</html>
